name: resilient_radio
description: A resilient live radio engine for Flutter with automatic recovery, stream diagnostics, and background playback.
version: 0.1.0
repository: https://github.com/aliMohamed2001/resilient_radio
issue_tracker: https://github.com/aliMohamed2001/resilient_radio/issues
topics:
  - radio
  - audio
  - streaming
  - live
  - background-audio

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  connectivity_plus: ^7.0.0
  just_audio: ^0.10.5

dev_dependencies:
  fake_async: ^1.3.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
